name: vidasalud

# Configuración común de los dos nodos RabbitMQ.
x-rabbitmq: &rabbitmq
  image: rabbitmq:3.13-management
  restart: unless-stopped
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Define RABBITMQ_USER en .env}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:?Define RABBITMQ_PASS en .env}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?Define RABBITMQ_ERLANG_COOKIE en .env}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
    interval: 10s
    timeout: 10s
    retries: 12
  networks:
    - vidasalud

services:
  rabbitmq1:
    <<: *rabbitmq
    hostname: rabbitmq1
    container_name: rabbitmq1
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Panel de administración
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq1-data:/var/lib/rabbitmq

  rabbitmq2:
    <<: *rabbitmq
    hostname: rabbitmq2
    container_name: rabbitmq2
    ports:
      - "5673:5672"
      - "15673:15672"
    volumes:
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - rabbitmq2-data:/var/lib/rabbitmq
    # Arranca después del primero para unirse a su clúster.
    depends_on:
      rabbitmq1:
        condition: service_healthy

  # ---------- Aplicaciones (perfil "apps") ----------
  # Se construyen desde los repos clonados al lado de este: ../vidasalud-ms-* y ../vidasalud-frontend

  appointments:
    profiles: ["apps"]
    build: ../vidasalud-ms-appointments
    container_name: appointments
    restart: unless-stopped
    environment:
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      # Pacientes simulados que reservan y cancelan horas (false para apagarlos).
      DEMANDA_SIMULADA: ${DEMANDA_SIMULADA:-true}
      # Contraseña de la base de datos en Supabase (se define en .env, nunca en el repositorio).
      DB_PASSWORD: ${DB_PASSWORD:-}
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    ports:
      - "8081:8081"
    depends_on:
      rabbitmq1:
        condition: service_healthy
    networks:
      - vidasalud

  notify:
    profiles: ["apps"]
    build: ../vidasalud-ms-notify
    container_name: notify
    restart: unless-stopped
    environment:
      RABBITMQ_ADDRESSES: rabbitmq1:5672,rabbitmq2:5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASS: ${RABBITMQ_PASS}
    ports:
      - "8083:8083"
    depends_on:
      rabbitmq1:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    networks:
      - vidasalud

  frontend:
    profiles: ["apps"]
    build: ../vidasalud-frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"         # CloudFront se conecta aquí y entrega el sitio por HTTPS
    networks:
      - vidasalud

volumes:
  rabbitmq1-data:
  rabbitmq2-data:

networks:
  vidasalud:
    name: vidasalud
