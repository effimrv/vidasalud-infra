name: vidasalud

# Clúster Kafka: 3 nodos Zookeeper, 3 brokers y Kafka-UI.
# Uso local:  docker compose -f docker-compose.kafka.yml up -d
# Uso junto a RabbitMQ y apps (misma red "vidasalud"):
#             docker compose -f docker-compose.yml -f docker-compose.kafka.yml --profile apps up -d
# En la EC2 (red vidasalud-net) agregar también el override de la EC2:
#             docker compose -f docker-compose.yml -f docker-compose.kafka.yml -f docker-compose.ec2.yml --profile apps up -d
# KAFKA_EXTERNAL_HOST (en .env) es la IP pública de la EC2 si se accede a los brokers desde fuera.
#
# Puertos del host:
#   9092 / 9093 / 9094  → brokers 1 / 2 / 3 (acceso desde el equipo, p. ej. con kafka-console)
#   8090                → Kafka-UI (administración de brokers, tópicos, particiones y mensajes)
#
# Dentro de la red de Docker las apps usan KAFKA_BOOTSTRAP_SERVERS=kafka1:29092,kafka2:29092,kafka3:29092

x-zookeeper-servers: &zookeeper-servers zookeeper1:2888:3888;zookeeper2:2888:3888;zookeeper3:2888:3888

x-zookeeper: &zookeeper
  image: confluentinc/cp-zookeeper:7.6.1
  restart: unless-stopped
  environment: &zookeeper-env
    ZOOKEEPER_TICK_TIME: 2000
    ZOOKEEPER_INIT_LIMIT: 5
    ZOOKEEPER_SYNC_LIMIT: 2
    ZOOKEEPER_CLIENT_PORT: 2181
    ZOOKEEPER_SERVERS: *zookeeper-servers
    KAFKA_HEAP_OPTS: "-Xms128m -Xmx128m"
  healthcheck:
    test: ["CMD-SHELL", "nc -z localhost 2181"]
    interval: 10s
    timeout: 5s
    retries: 12
  networks:
    - vidasalud

x-kafka: &kafka
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  environment: &kafka-env
    KAFKA_ZOOKEEPER_CONNECT: zookeeper1:2181,zookeeper2:2181,zookeeper3:2181
    # Listener INTERNAL: entre contenedores. EXTERNAL: desde el host (o la IP pública de la EC2).
    KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
    KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
    KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
    # Política de durabilidad: 3 réplicas por partición y al menos 2 réplicas sincronizadas para aceptar escrituras con acks=all.
    KAFKA_DEFAULT_REPLICATION_FACTOR: 3
    KAFKA_MIN_INSYNC_REPLICAS: 2
    KAFKA_NUM_PARTITIONS: 3
    KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
    KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
    # Los tópicos se crean explícitamente (microservicio administrador o beans NewTopic), no por accidente.
    KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    KAFKA_LOG_RETENTION_HOURS: 168
    KAFKA_HEAP_OPTS: "-Xms256m -Xmx256m"
  depends_on:
    zookeeper1:
      condition: service_healthy
    zookeeper2:
      condition: service_healthy
    zookeeper3:
      condition: service_healthy
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:29092 > /dev/null 2>&1"]
    interval: 15s
    timeout: 15s
    retries: 12
  networks:
    - vidasalud

services:
  zookeeper1:
    <<: *zookeeper
    hostname: zookeeper1
    container_name: zookeeper1
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 1
    volumes:
      - zk1-data:/var/lib/zookeeper/data
      - zk1-log:/var/lib/zookeeper/log

  zookeeper2:
    <<: *zookeeper
    hostname: zookeeper2
    container_name: zookeeper2
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 2
    volumes:
      - zk2-data:/var/lib/zookeeper/data
      - zk2-log:/var/lib/zookeeper/log

  zookeeper3:
    <<: *zookeeper
    hostname: zookeeper3
    container_name: zookeeper3
    environment:
      <<: *zookeeper-env
      ZOOKEEPER_SERVER_ID: 3
    volumes:
      - zk3-data:/var/lib/zookeeper/data
      - zk3-log:/var/lib/zookeeper/log

  kafka1:
    <<: *kafka
    hostname: kafka1
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 1
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9092
    volumes:
      - kafka1-data:/var/lib/kafka/data

  kafka2:
    <<: *kafka
    hostname: kafka2
    container_name: kafka2
    ports:
      - "9093:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 2
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9093
    volumes:
      - kafka2-data:/var/lib/kafka/data

  kafka3:
    <<: *kafka
    hostname: kafka3
    container_name: kafka3
    ports:
      - "9094:9092"
    environment:
      <<: *kafka-env
      KAFKA_BROKER_ID: 3
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:9094
    volumes:
      - kafka3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    restart: unless-stopped
    hostname: kafka-ui
    container_name: kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: vidasalud
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29092,kafka3:29092
      DYNAMIC_CONFIG_ENABLED: "true"
      JAVA_OPTS: "-Xms96m -Xmx192m"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    networks:
      - vidasalud

volumes:
  zk1-data:
  zk1-log:
  zk2-data:
  zk2-log:
  zk3-data:
  zk3-log:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  vidasalud:
    name: vidasalud
